version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: ecommerce-db
    restart: always
    environment:
      - POSTGRES_DB=ecommerce_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    volumes:
      - db_data:/var/lib/postgresql/data

  flyway:
    image: flyway/flyway:10-alpine
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    volumes:
      - ./ec-infra/src/main/resources/db/migration:/flyway/sql:ro
      - ./ec-infra/src/main/resources/db/seed:/flyway/seed:ro
    environment:
      - FLYWAY_URL=jdbc:postgresql://db:5432/ecommerce_db
      - FLYWAY_USER=postgres
      - FLYWAY_PASSWORD=postgres
      - FLYWAY_CONNECT_RETRIES=60
    command: >
      -schemas=public 
      -baselineOnMigrate=true 
      -connectRetries=60 
      -locations=filesystem:/flyway/sql,filesystem:/flyway/seed 
      migrate

  backend:
    image: shawndebie/ec-backend:latest
    container_name: ec-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - app-network
    volumes:
      - ./secrets:/deployments/secrets:ro
      # MOUNT TO WORKING DIR BINARY DIRECTORY
      - /opt/zacommerce/storage/images:/deployments/storage/images
    environment:
      - QUARKUS_DATASOURCE_REACTIVE_URL=postgresql://db:5432/ecommerce_db
      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://db:5432/ecommerce_db
      - QUARKUS_DATASOURCE_USERNAME=postgres
      - QUARKUS_DATASOURCE_PASSWORD=postgres
      - QUARKUS_HTTP_HOST=0.0.0.0
      - CORS_ORIGINS=http://localhost:3001,http://127.0.0.1:3001,http://192.168.1.16:3001,https://zacommerce.co.za
      - QUARKUS_HTTP_CORS_ACCESS_CONTROL_ALLOW_CREDENTIALS=true

      - SMALLRYE_JWT_SIGN_KEY_LOCATION=/deployments/secrets/privateKey.pem
      - SMALLRYE_JWT_VERIFY_KEY_LOCATION=/deployments/secrets/publicKey.pem

      # MATCH NEW PATH ABOVE
      - IMAGE_STORAGE_PATH=/deployments/storage/images
    depends_on:
      db:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully

  frontend:
    #Pull Frontend
    #image: ghcr.io/sdebie/ec-frontend:main
    #restart: unless-stopped

    #Build Frontend
    build:
      context: ./ec-frontend
      dockerfile: Dockerfile.jvm

    container_name: ec-frontend
    ports:
      - "3001:80"
    environment:
      - VITE_API_URL=https://ecapi.sdebiehome.co.za
      - VITE_IMAGE_BASE_URL=/static/images/
      - VITE_API_BASE_URL=/api/
      - VITE_PROXY_TARGET=http://ec-backend:8080
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db_data: